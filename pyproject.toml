[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "uav-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3,<2.6",
    "torchvision>=0.18",
    "ultralytics>=8.3,<8.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "lapx>=0.5",
    "scipy>=1.10",
    "tqdm>=4.65",
    "pillow>=10.0",
    "PySide6>=6.5",
    "requests>=2.28",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["src/uav_tracker", "app"]
omit = ["*/legacy/*", "*/hailo_backend*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
